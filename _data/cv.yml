  - title: Research Interests
    text: >-
      Mathematics graduate with experience in Lean-based formalization and proof
      automation. Research interests include formal methods and machine-checked
      verification of cryptographic systems, particularly zero-knowledge proofs
      and SNARKs, and connections between mathematical specifications and
      executable implementations.

