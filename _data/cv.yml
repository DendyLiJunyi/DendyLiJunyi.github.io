        subtitle: "Research Intern, University of Edinburgh · Supervisor: Prof. Wenda Li"
        date: Sep 2025 – Feb 2026
        location: Edinburgh, United Kingdom
        url: https://github.com/DendyLiJunyi/LeanHammer/tree/reconstructed
        description: Independent internship project, separate from the public LeanHammer project of the same name.
        details:
          - Developed a Lean 4 tactic integrating premise selection, goal-driven monomorphization, and SMT-LIB translation for Z3 and cvc5.
