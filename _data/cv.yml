        details:
          - Developed a Lean lemma library for Chinese Gaokao mathematics, covering sequences and calculus.
          - Designed an LLM-assisted prover for Gaokao-style problems, combining retrieval-augmented generation (RAG) with a Lean formalization pipeline.

