<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ site.data.cv.name | strip_html }} — CV</title>
  <style>
    :root { --ink:#1a1a1a; --muted:#666; --rule:#d9d9d9; --maxw:800px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Charter","Georgia","Times New Roman",serif;
      color: var(--ink); background:#f2f2f2; line-height:1.5; font-size:15px;
    }

    .cv-toolbar {
      max-width: var(--maxw); margin: 24px auto 0;
      display:flex; justify-content:space-between; align-items:center; padding:0 8px;
    }
    .cv-toolbar a, .cv-toolbar button {
      font-family: system-ui, sans-serif; font-size:14px; color:#444;
      text-decoration:none; background:#fff; border:1px solid #ccc;
      border-radius:6px; padding:8px 14px; cursor:pointer;
    }
    .cv-toolbar button:hover, .cv-toolbar a:hover { background:#f5f5f5; }

    .cv-sheet {
      max-width: var(--maxw); margin:16px auto 48px; background:#fff;
      padding:48px 56px; box-shadow:0 1px 6px rgba(0,0,0,.12);
    }

    .cv-name { font-size:30px; font-weight:700; letter-spacing:.3px; margin:0; }
    .cv-tagline { color:var(--muted); font-size:16px; margin:2px 0 8px; }
    .cv-contacts { font-family: system-ui, sans-serif; font-size:13px; color:var(--muted); }
    .cv-contacts a { color:var(--muted); text-decoration:none; }
    .cv-contacts a:hover { text-decoration:underline; }
    .cv-contacts .sep { margin:0 8px; color:#bbb; }

    .cv-section { margin-top:26px; }
    .cv-section-title {
      font-family: system-ui, sans-serif; font-size:13px; font-weight:700;
      text-transform:uppercase; letter-spacing:1.5px; color:#2a2a2a;
      border-bottom:1.5px solid var(--rule); padding-bottom:4px; margin:0 0 12px;
    }

    .cv-entry { margin-bottom:14px; page-break-inside:avoid; }
    .cv-entry:last-child { margin-bottom:0; }
    .cv-entry-head { display:flex; justify-content:space-between; align-items:baseline; gap:16px; }
    .cv-entry-title { font-weight:700; }
    .cv-entry-title a { color:inherit; text-decoration:none; }
    .cv-entry-title a:hover { text-decoration:underline; }
    .cv-entry-meta {
      font-family: system-ui, sans-serif; font-size:12.5px; color:var(--muted);
      white-space:nowrap; text-align:right;
    }
    .cv-entry-sub { color:#333; font-style:italic; }
    .cv-details { margin:6px 0 0; padding-left:18px; }
    .cv-details li { margin:2px 0; }

    @page { size: A4; margin: 14mm 16mm; }
    @media print {
      body { background:#fff; font-size:11pt; }
      .cv-toolbar { display:none !important; }
      .cv-sheet { max-width:none; margin:0; padding:0; box-shadow:none; }
      a { color:inherit !important; }
      .cv-section { margin-top:18px; }
    }
  </style>
</head>
<body>
  <div class="cv-toolbar">
    <a href="{{ '/cv/' | relative_url }}">&larr; Back to CV</a>
    <button onclick="window.print()">&#x2913; Save as PDF</button>
  </div>

  <main class="cv-sheet">
    {% include cv-body.html %}
  </main>

  <script>
    // Open the print dialog automatically for a one-click "Download PDF" flow.
    window.addEventListener('load', function () {
      setTimeout(function () { window.print(); }, 500);
    });
  </script>
</body>
</html>
